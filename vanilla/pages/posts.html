<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publicaciones | Tennis Club Social Manager</title>
  <link rel="stylesheet" href="../styles/style.css" />
</head>

<body data-page="posts">

  <!-- Sidebar generado dinámicamente por renderSidebar() en app.js -->
  <aside id="sidebar"></aside>

  <div class="layout">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar__greeting">
        <h2 class="topbar__title">Publicaciones</h2>
        <p class="topbar__date" id="current-date"></p>
      </div>
      <div class="topbar__actions">
        <button class="btn btn--primary" id="btn-new-post">+ Nueva publicación</button>
      </div>
    </header>

    <main class="main-content">

      <!-- FILTROS POR STATUS -->
      <section class="section">
        <div class="tabs" id="posts-tabs" role="tablist" aria-label="Filtrar por estado">
          <button class="tab tab--active" role="tab" data-filter="all">Todas</button>
          <button class="tab" role="tab" data-filter="draft">Borrador</button>
          <button class="tab" role="tab" data-filter="scheduled">Programadas</button>
          <button class="tab" role="tab" data-filter="published">Publicadas</button>
        </div>
      </section>

      <!-- LISTA DE POSTS -->
      <section class="section" aria-labelledby="posts-heading">
        <h2 id="posts-heading" class="section__title">
          Listado <span id="posts-count" class="count-badge">0</span>
        </h2>

        <!-- Lista renderizada por JS (tarea #08) -->
        <ul class="posts-full-list" id="posts-list">
          <li class="list-empty">No hay publicaciones todavía.</li>
        </ul>
      </section>

    </main>

    <footer class="footer">
      <p class="footer__text">Tennis Club Social Manager &copy; 2026</p>
    </footer>

  </div><!-- /.layout -->

  <!-- MODAL compartido -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__overlay" id="modal-overlay"></div>
    <div class="modal__body">
      <div class="modal__header">
        <h3 class="modal__title" id="modal-title"></h3>
        <button class="modal__close" id="modal-close" aria-label="Cerrar">&times;</button>
      </div>
      <div class="modal__content" id="modal-content"></div>
      <div class="modal__footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- TOAST compartido -->
  <div class="toast" id="toast" role="alert" aria-live="polite">
    <span class="toast__icon" id="toast-icon"></span>
    <span class="toast__message" id="toast-message"></span>
  </div>

  <script src="../scripts/app.js"></script>
</body>
</html>
